name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Create release key (first time only)
        env:
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -keystore release.keystore -storetype PKCS12 -storepass "$KEY_PASS" -keypass "$KEY_PASS" -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PDF Nest,O=PDF Nest,C=PK"
            git config user.name github-actions
            git config user.email actions@github.com
            git add -f release.keystore
            git commit -m "Add release keystore [skip ci]"
            git push
          fi
      - name: Read Gradle version
        id: gv
        run: echo "v=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9.]+)-.*/\1/')" >> $GITHUB_OUTPUT
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.gv.outputs.v }}
      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.KEY_PASS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASS }}
        run: gradle assembleRelease
      - name: Check APK signature
        run: |
          APK=$(find . -path "*build/outputs/apk/release/*.apk" | head -n 1)
          ls -la "$(dirname "$APK")" > check.txt
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" >> check.txt 2>&1 || echo "VERIFY FAILED" >> check.txt
          cat check.txt
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -path "*build/outputs/apk/release/*.apk" | head -n 1)
          cp "$APK" pdf-nest.apk
          gh release create "release-${{ github.run_number }}" pdf-nest.apk --title "PDF Nest release ${{ github.run_number }}" --notes-file check.txt
